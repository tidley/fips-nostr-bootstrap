[package]
name = "fips-nostr-rendezvous"
version = "0.1.0"
edition = "2021"
description = "Core rendezvous protocol types and packet helpers for Nostr-signaled UDP NAT traversal"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
fips = { path = "../../../fips", default-features = false }
nostr = { version = "0.39", features = ["std", "nip59"] }
nostr-sdk = "0.39"
rand = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
